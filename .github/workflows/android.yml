name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Keep in step with scripts/ci/prepare_natives.sh; exported here so the cache key and
  # the BuildConfig stamp both see the same pin.
  SHERPA_VERSION: "1.13.8"
  LLAMA_COMMIT: "fee39dd92673ba0c08c8da96040ce53368b35188"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      # The llama.cpp AAR takes a full NDK build, so it is cached on its commit rather
      # than rebuilt every push.
      - name: Cache llama.cpp AAR
        uses: actions/cache@v4
        with:
          path: core-llm/libs/llama-release.aar
          key: llama-aar-${{ env.LLAMA_COMMIT }}-arm64-v1

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: core-asr/libs/sherpa-onnx-static-link-onnxruntime-${{ env.SHERPA_VERSION }}.aar
          key: sherpa-aar-${{ env.SHERPA_VERSION }}-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Fetch native runtimes
        run: ./scripts/ci/prepare_natives.sh

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload razr APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-razr-debug
          path: app/build/outputs/apk/razr/debug/*.apk
          if-no-files-found: error

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      # Unit tests are pure JVM and touch neither native runtime, so the AARs are not
      # fetched here — that keeps the feedback loop short.
      - name: Run unit tests
        run: ./gradlew --no-daemon test

  release:
    # Only tagged pushes publish, and only when a signing key exists. Without the secrets
    # this job is skipped rather than producing an unsigned APK that cannot be updated
    # over the top later.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are present
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::KEYSTORE_BASE64 is not set. See README 'Release signing' for the"
            echo "::error::commands to generate the keystore and add the four secrets."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      - name: Cache llama.cpp AAR
        uses: actions/cache@v4
        with:
          path: core-llm/libs/llama-release.aar
          key: llama-aar-${{ env.LLAMA_COMMIT }}-arm64-v1

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: core-asr/libs/sherpa-onnx-static-link-onnxruntime-${{ env.SHERPA_VERSION }}.aar
          key: sherpa-aar-${{ env.SHERPA_VERSION }}-v1

      - name: Fetch native runtimes
        run: ./scripts/ci/prepare_natives.sh

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # versionCode must increase monotonically: major*10000 + minor*100 + patch.
          IFS='.' read -r MAJ MIN PAT <<< "${TAG%%-*}"
          echo "code=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect and checksum artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/razr/release/*.apk dist/recorder-razr-release.apk
          cp app/build/outputs/apk/standard/release/*.apk dist/recorder-standard-release.apk
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      - name: Verify the APKs are actually signed
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/recorder-razr-release.apk
            dist/recorder-standard-release.apk
            dist/SHA256SUMS
          generate_release_notes: true
          # Downloads are served from releases/latest/download/<asset>, so the install page
          # never needs editing when a new version ships.
          make_latest: true

      - name: Upload release artifacts for the install page
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
