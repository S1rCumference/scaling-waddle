name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Keep in step with scripts/ci/prepare_natives.sh; exported here so the cache key and
  # the BuildConfig stamp both see the same pin.
  SHERPA_VERSION: "1.13.8"
  LLAMA_COMMIT: "fee39dd92673ba0c08c8da96040ce53368b35188"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      # The llama.cpp AAR takes a full NDK build, so it is cached on its commit rather
      # than rebuilt every push.
      - name: Cache llama.cpp AAR
        uses: actions/cache@v4
        with:
          path: core-llm/libs/llama-release.aar
          key: llama-aar-${{ env.LLAMA_COMMIT }}-arm64-v1

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: core-asr/libs/sherpa-onnx-static-link-onnxruntime-${{ env.SHERPA_VERSION }}.aar
          key: sherpa-aar-${{ env.SHERPA_VERSION }}-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Fetch native runtimes
        run: ./scripts/ci/prepare_natives.sh

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      # A green build is not proof the runtimes survived packaging: the ABI excludes that
      # resolve the duplicate libonnxruntime.so could just as easily drop too much, and
      # the failure mode on the phone is a silent "no transcription".
      - name: Verify the APK carries both native runtimes
        run: |
          APK="$(ls app/build/outputs/apk/razr/debug/*.apk | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          LIBS="$(unzip -l "$APK" | grep -oE 'lib/[^/]+/[^ ]+\.so' | sort -u)"
          echo "$LIBS"

          for required in libsherpa-onnx-jni.so libonnxruntime.so libllama.so libai-chat.so; do
            echo "$LIBS" | grep -q "/$required$" || {
              echo "::error::$required is missing from the APK"
              exit 1
            }
          done

          OTHER="$(echo "$LIBS" | grep -v '^lib/arm64-v8a/' || true)"
          if [ -n "$OTHER" ]; then
            echo "::error::non-arm64 native libraries were packaged: $OTHER"
            exit 1
          fi
          echo "OK: both runtimes present, arm64 only"

      - name: Upload razr APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-razr-debug
          path: app/build/outputs/apk/razr/debug/*.apk
          if-no-files-found: error

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      # Unit tests are pure JVM and touch neither native runtime, so the AARs are not
      # fetched here — that keeps the feedback loop short.
      - name: Run unit tests
        run: ./gradlew --no-daemon test

  release:
    # Only tagged pushes publish. Signing needs no configuration: the keystore is committed
    # at signing/recorder.keystore with a known password, so any checkout of this repo builds
    # an APK that installs over the top of the previous one. See README, "Signing".
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default is "tools platform-tools", and the obsolete "tools" package was
          # removed from the SDK repository, which makes the action itself fail.
          packages: platform-tools

      - name: Cache llama.cpp AAR
        uses: actions/cache@v4
        with:
          path: core-llm/libs/llama-release.aar
          key: llama-aar-${{ env.LLAMA_COMMIT }}-arm64-v1

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: core-asr/libs/sherpa-onnx-static-link-onnxruntime-${{ env.SHERPA_VERSION }}.aar
          key: sherpa-aar-${{ env.SHERPA_VERSION }}-v1

      - name: Fetch native runtimes
        run: ./scripts/ci/prepare_natives.sh

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # versionCode must increase monotonically: major*10000 + minor*100 + patch.
          IFS='.' read -r MAJ MIN PAT <<< "${TAG%%-*}"
          echo "code=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect and checksum artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/razr/release/*.apk dist/recorder-razr-release.apk
          cp app/build/outputs/apk/standard/release/*.apk dist/recorder-standard-release.apk
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      - name: Verify the APKs are actually signed
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/recorder-razr-release.apk
            dist/recorder-standard-release.apk
            dist/SHA256SUMS
          generate_release_notes: true
          # Downloads are served from releases/latest/download/<asset>, so the install page
          # never needs editing when a new version ships.
          make_latest: true

      - name: Upload release artifacts for the install page
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  pages:
    # Publishes the install page people download from. Runs after a release so it can embed
    # that build's real digests and a provisioning QR generated from its signing
    # certificate; also runnable by hand so the page exists before the first release.
    needs: [release]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Best effort: present on a tagged run, absent on a manual one, and the page builder
      # handles both.
      - name: Fetch release artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-dist
          path: dist

      - name: Build the install page
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          if [ -d dist ]; then
            ./scripts/ci/build_install_page.sh dist
          else
            ./scripts/ci/build_install_page.sh
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
