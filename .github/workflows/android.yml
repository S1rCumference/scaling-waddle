name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug

      # The razr flavour carries the cover-screen UI; standard is the --no-cover-ui build
      # for anyone on a non-flip phone (Phase 7).
      - name: Upload razr APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-razr-debug
          path: app/build/outputs/apk/razr/debug/*.apk
          if-no-files-found: error

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: recorder-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew --no-daemon testRazrDebugUnitTest
