org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release asset base name, shared by CI, the install page and the in-app updater so they
# cannot drift. It must keep matching what already-installed builds look for, or their
# "check for updates" stops finding anything: assets are <prefix>-razr-release.apk and
# <prefix>-standard-release.apk.
recorder.releaseAssetPrefix=recorder

# The version this branch builds. CI reads it to publish v<this> as a release, so the phone's
# "check for updates" finds the build without anyone tagging by hand or reinstalling. Bump it
# in the same commit as the change: leaving it alone means the tag already exists and the
# release step no-ops. A tagged push still takes its version from the tag.
recorder.versionName=2.4.2
