org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release asset names for this line of the app. 2.1 installs beside the stable build under
# its own application id, so its APKs need names of their own too: CI, the install page and
# the in-app updater all read this one value.
recorder.releaseAssetPrefix=recorder-v21
